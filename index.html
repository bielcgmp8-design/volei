<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteio Vôlei Mobile</title>
    <style>
        /* Cores e Reset */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5; 
            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px;
        }

        h2 { color: #004e89; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        h3 { color: #ff6b35; margin-top: 0; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        label { 
            display: block; 
            margin: 12px 0 6px; 
            font-weight: 600; 
            color: #333;
            font-size: 0.95rem;
        }

        /* Ajustes para Inputs no Celular */
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; /* Evita zoom automático no iPhone */
            background: #fafafa;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #ff6b35;
            outline: none;
            background: #fff;
        }

        textarea { height: 100px; line-height: 1.4; }

        .captains-area { 
            background: #f8faff; 
            padding: 12px; 
            border-radius: 10px; 
            border: 2px dashed #004e89; 
            margin-bottom: 15px;
        }

        .category-area {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .captain-input { margin-bottom: 10px; }

        /* Botões Estilo Mobile */
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .btn-sortear { background: #ff6b35; color: white; }
        .btn-voltar { background: #6c757d; color: white; margin-top: 10px; }

        /* Resultado das Equipes */
        .team { 
            background: #fff; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 12px;
            border: 1px solid #eee;
            border-top: 5px solid #004e89;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .team strong { color: #004e89; font-size: 1.2rem; display: block; margin-bottom: 8px; }
        .player-item { padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
        .player-item:last-child { border-bottom: none; }
        
        .captain-tag { 
            background: #d9534f; 
            color: white; 
            font-size: 10px; 
            padding: 2px 6px; 
            border-radius: 4px; 
            margin-left: 5px;
            vertical-align: middle;
        }
        
        .level-tag {
            color: #888;
            font-size: 0.8rem;
            margin-left: 5px;
            font-style: italic;
        }

        .team-score {
            font-size: 0.85rem;
            color: #666;
            font-weight: normal;
            float: right;
            margin-top: 4px;
        }

        #results { display: none; }
    </style>
</head>
<body>

<div class="box" id="setup">
    <h2>🏐 Sorteio de Vôlei</h2>
    
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <div style="flex: 1;">
            <label>Nº de Times</label>
            <input type="number" id="numTeams" value="2" min="1" oninput="gerarCamposCapitaes()">
        </div>
        <div style="flex: 1;">
            <label>Pessoas/Time</label>
            <input type="number" id="perTeam" value="6" min="2">
        </div>
    </div>

    <label>⭐ Nome dos Capitães:</label>
    <div id="captainsContainer" class="captains-area"></div>

    <div class="category-area">
        <h3>Jogadores</h3>
        <label>Nível 1 (Avançado):</label>
        <textarea id="n1" placeholder="Um nome por linha..."></textarea>
        
        <label>Nível 2 (Intermediário):</label>
        <textarea id="n2" placeholder="Um nome por linha..."></textarea>
        
        <label>Nível 3 (Iniciante):</label>
        <textarea id="n3" placeholder="Um nome por linha..."></textarea>
    </div>

    <button class="btn-sortear" onclick="sortear()">SORTEAR AGORA</button>
</div>

<div class="box" id="results">
    <h2>Equipes Formadas</h2>
    <div id="teamList"></div>
    <button class="btn-sortear" onclick="sortear()">🔄 SORTEAR NOVAMENTE</button>
    <button class="btn-voltar" onclick="voltar()">✏️ EDITAR DADOS</button>
</div>

<script>
    function gerarCamposCapitaes() {
        const n = parseInt(document.getElementById('numTeams').value) || 0;
        const container = document.getElementById('captainsContainer');
        container.innerHTML = '';
        for (let i = 1; i <= n; i++) {
            container.innerHTML += `
                <div class="captain-input" style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center;">
                    <input type="text" class="cap-name" placeholder="Nome do Capitão ${i}" style="flex: 1.5; margin: 0;">
                    <select class="cap-level" style="flex: 1; margin: 0; padding: 10px; font-size: 14px;">
                        <option value="3">Nível 1 (N1)</option>
                        <option value="2" selected>Nível 2 (N2)</option>
                        <option value="1">Nível 3 (N3)</option>
                    </select>
                </div>`;
        }
    }

    window.onload = gerarCamposCapitaes;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Calcula a variância dos pontos entre os times (quanto menor, mais equilibrado)
    function getScoreVariance(assignments, teams, selectedPlayers) {
        let tempScores = teams.map(t => t.captainWeight);
        for (let i = 0; i < assignments.length; i++) {
            let teamIdx = assignments[i];
            tempScores[teamIdx] += selectedPlayers[i].peso;
        }
        let mean = tempScores.reduce((a, b) => a + b, 0) / tempScores.length;
        let variance = tempScores.reduce((sum, s) => sum + Math.pow(s - mean, 2), 0);
        return variance;
    }

    function sortear() {
        const nTeams = parseInt(document.getElementById('numTeams').value);
        const pTeam = parseInt(document.getElementById('perTeam').value);
        const capInputs = document.querySelectorAll('.cap-name');
        const capLevels = document.querySelectorAll('.cap-level');
        
        let captains = [];
        for (let i = 0; i < capInputs.length; i++) {
            let name = capInputs[i].value.trim();
            let peso = parseInt(capLevels[i].value);
            if (name !== "") {
                captains.push({ name: name, peso: peso });
            }
        }

        // Captura listas originais
        let rawN1 = document.getElementById('n1').value.split('\n').filter(n => n.trim() !== "");
        let rawN2 = document.getElementById('n2').value.split('\n').filter(n => n.trim() !== "");
        let rawN3 = document.getElementById('n3').value.split('\n').filter(n => n.trim() !== "");

        if (captains.length < nTeams) {
            alert(`Preencha os ${nTeams} capitães!`);
            return;
        }

        const totalPlayers = rawN1.length + rawN2.length + rawN3.length;
        const faltam = (nTeams * pTeam) - nTeams; 
        
        if (totalPlayers < faltam) {
            alert(`Faltam ${faltam - totalPlayers} jogadores no total para preencher as equipes.`);
            return;
        }

        // Criar pools de jogadores com pesos (N1 = 3 pts, N2 = 2 pts, N3 = 1 pt)
        let poolN1 = rawN1.map(n => ({ name: n, peso: 3 }));
        let poolN2 = rawN2.map(n => ({ name: n, peso: 2 }));
        let poolN3 = rawN3.map(n => ({ name: n, peso: 1 }));

        // Embaralha cada pool separadamente para manter o fator aleatório
        poolN1 = shuffle(poolN1); 
        poolN2 = shuffle(poolN2); 
        poolN3 = shuffle(poolN3);

        // Selecionar exatamente a quantidade de jogadores necessários preservando a proporção de níveis
        let selectedPlayers = [];
        let p1 = [...poolN1];
        let p2 = [...poolN2];
        let p3 = [...poolN3];
        
        let poolsList = [p1, p2, p3];
        let poolIndex = 0;
        while (selectedPlayers.length < faltam) {
            let activePools = poolsList.filter(p => p.length > 0);
            if (activePools.length === 0) break;
            
            for (let i = 0; i < poolsList.length; i++) {
                let idx = (poolIndex + i) % poolsList.length;
                if (poolsList[idx].length > 0 && selectedPlayers.length < faltam) {
                    selectedPlayers.push(poolsList[idx].pop());
                }
            }
            poolIndex = (poolIndex + 1) % poolsList.length;
        }

        // Inicializa os times com capitães e seus respectivos pesos
        let teams = captains.map(cap => ({
            captainName: cap.name,
            captainWeight: cap.peso,
            players: [{ name: cap.name, peso: cap.peso, isCaptain: true }],
            score: cap.peso
        }));

        // Cria uma lista de atribuições válidas (ex: se temos 2 times e precisamos de 5 vagas por time, gera 5 'zeros' e 5 'uns')
        let assignments = [];
        for (let t = 0; t < nTeams; t++) {
            for (let j = 0; j < pTeam - 1; j++) {
                assignments.push(t);
            }
        }
        assignments = shuffle(assignments);

        let bestAssignments = [...assignments];
        let bestVariance = getScoreVariance(bestAssignments, teams, selectedPlayers);

        // Hill Climbing: Executa 3000 tentativas de trocas de jogadores buscando o menor desequilíbrio matemático
        for (let iter = 0; iter < 3000; iter++) {
            let idx1 = Math.floor(Math.random() * assignments.length);
            let idx2 = Math.floor(Math.random() * assignments.length);
            if (idx1 === idx2) continue;

            // Faz a troca temporária
            [assignments[idx1], assignments[idx2]] = [assignments[idx2], assignments[idx1]];

            let currentVariance = getScoreVariance(assignments, teams, selectedPlayers);
            if (currentVariance < bestVariance) {
                bestVariance = currentVariance;
                bestAssignments = [...assignments];
            } else {
                // Desfaz a troca se ela piorou ou manteve igual o equilíbrio
                [assignments[idx1], assignments[idx2]] = [assignments[idx2], assignments[idx1]];
            }
        }

        // Aplica o melhor arranjo encontrado aos times reais
        for (let i = 0; i < bestAssignments.length; i++) {
            let teamIdx = bestAssignments[i];
            let player = selectedPlayers[i];
            teams[teamIdx].players.push(player);
            teams[teamIdx].score += player.peso;
        }

        // Renderiza o resultado das equipes
        document.getElementById('teamList').innerHTML = teams.map((t, i) => {
            let playersHtml = t.players.map(p => {
                let levelLabel = p.peso === 3 ? "N1" : (p.peso === 2 ? "N2" : "N3");
                if (p.isCaptain) {
                    return `<div class="player-item">• ${p.name} <span class="captain-tag">CAP</span> <span class="level-tag">(${levelLabel})</span></div>`;
                } else {
                    return `<div class="player-item">• ${p.name} <span class="level-tag">(${levelLabel})</span></div>`;
                }
            }).join('');

            return `
                <div class="team">
                    <strong>Time ${i+1} <span class="team-score">Força Total: ${t.score} pts</span></strong>
                    ${playersHtml}
                </div>
            `;
        }).join('');
        
        document.getElementById('setup').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function voltar() {
        document.getElementById('setup').style.display = 'block';
        document.getElementById('results').style.display = 'none';
    }
</script>
</body>
</html>
